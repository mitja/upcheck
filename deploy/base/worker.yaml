# Celery worker — runs the HTTP checks. Same image and env as web.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: upcheck
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upcheck
      component: worker
  template:
    metadata:
      labels:
        app: upcheck
        component: worker
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: worker
          image: ghcr.io/mitja/upcheck:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "project", "worker", "-l", "INFO", "--concurrency", "2"]
          envFrom:
            - configMapRef: { name: upcheck-config }
            - secretRef: { name: upcheck-secrets }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: pg-app, key: uri }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
